<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AjCoach — {{ persona }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --theme-color: #a78bfa;
      --sidebar-width: 280px;
      --content-max-width: 860px;
      --base-font-size: 15px;
    }

    .persona-nav {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 100;
      display: flex;
      gap: 0.4rem;
      padding: 0.6rem 1rem;
    }

    .persona-nav a {
      font-size: 0.78rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      text-decoration: none;
      color: #94a3b8;
      border: 1px solid #2d3148;
      transition: all 0.15s;
    }

    .persona-nav a:hover { color: #e2e8f0; border-color: #a78bfa; }
    .persona-nav a.active { color: #a78bfa; border-color: #a78bfa; }
  </style>
</head>
<body>
  <nav class="persona-nav">
    {% for p in personas %}
      <a href="/{{ p }}/" class="{{ 'active' if p == persona else '' }}">{{ p }}</a>
    {% endfor %}
    <a href="/logout" style="color:#f87171;border-color:#4b1c1c">logout</a>
  </nav>

  <div id="app">Loading…</div>

  <script>
    window.$docsify = {
      name: '{{ persona }}',
      basePath: '/{{ persona }}/',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'profile.md',
      search: {
        placeholder: 'Search',
        noData: 'No results',
        depth: 4,
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
</body>
</html>
